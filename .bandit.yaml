# Bandit configuration for the Cortex security-scan CI gate.
# CI runs bandit at MEDIUM-or-higher severity (-ll). The test IDs skipped below were each
# reviewed and are false positives in this codebase; every skip is documented so a future
# maintainer can re-audit. Do NOT add blanket skips — prefer an inline `# nosec <ID>` with a
# reason for one-off false positives so new occurrences of a class are still flagged.
skips:
  # B608 hardcoded_sql_expressions: the SQL f-strings interpolate only hardcoded predicate
  # literals (e.g. " AND ".join(["user_id = ?", ...]) in the _*_filters helpers); every user
  # value is bound as a `?` parameter. Reviewed across storage.py — no injection vector.
  - B608
  # B310 urllib urlopen: connector HTTP calls target trusted, validated OAuth/API endpoints
  # and already carry maintainer `# noqa: S310` rationale; scripts hit the local Cortex API.
  - B310
  # B108 hardcoded_tmp_directory: only in test fixtures and one baseline-data literal, never
  # on a runtime path.
  - B108
