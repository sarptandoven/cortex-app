    <rect x="12" y="10" width="188" height="1.4" fill="#ffffff" opacity="0.55"/>
  </g>
  <text x="106.0" y="33.2" fill="#000000" fill-opacity="0.4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central" textLength="144" lengthAdjust="spacingAndGlyphs">Academic Research</text>
  <text x="106.0" y="32.0" fill="#FFFFFF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central" textLength="144" lengthAdjust="spacingAndGlyphs">Academic Research</text>
</svg>
