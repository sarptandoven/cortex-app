<svg xmlns="http://www.w3.org/2000/svg" width="212" height="70" viewBox="0 0 212 70" role="img" aria-label="Academic Research">
  <title>Academic Research</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ca58b9"/>
      <stop offset="0.5" stop-color="#B5179E"/>
      <stop offset="1" stop-color="#91127e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="12" y="9" width="188" height="46" rx="13" ry="13"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="12" y="9" width="188" height="46" rx="13" ry="13" fill="url(#fill)" stroke="#5e0c52" stroke-width="1"/>
