<svg xmlns="http://www.w3.org/2000/svg" width="233" height="70" viewBox="0 0 233 70" role="img" aria-label="University of Waterloo">
  <title>University of Waterloo</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee180"/>
      <stop offset="0.5" stop-color="#FDD54F"/>
      <stop offset="1" stop-color="#caaa3f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="12" y="9" width="209" height="46" rx="13" ry="13"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
