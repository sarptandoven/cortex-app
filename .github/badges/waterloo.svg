  <text x="116.5" y="33.2" fill="#FFFFFF" fill-opacity="0.35" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central" textLength="165" lengthAdjust="spacingAndGlyphs">University of Waterloo</text>
  <text x="116.5" y="32.0" fill="#141414" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central" textLength="165" lengthAdjust="spacingAndGlyphs">University of Waterloo</text>
