name: Feature request
description: Propose a focused improvement to Cortex
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow or limitation before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would make this request successful?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Local-first and privacy implications
      description: Note any effect on storage, permissions, imports, network access, or data shared with AI tools.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: Optional files, tests, or acceptance criteria that could keep this independently reviewable.
