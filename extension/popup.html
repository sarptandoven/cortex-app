<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Memory</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #1f2328;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        background: linear-gradient(135deg, #6d5efc 0%, #8b5cf6 100%);
        color: #fff;
      }
      header .mark { font-size: 16px; }
      header h1 { margin: 0; font-size: 15px; font-weight: 700; }
      .body { padding: 14px 16px 16px; }
      .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: #c0c4cc; }
      .dot.ok { background: #1f9d55; }
      .dot.warn { background: #d4a017; }
      .dot.err { background: #cf222e; }
      .meta { font-size: 12px; color: #57606a; margin: 2px 0 14px; word-break: break-all; }
      button {
        width: 100%;
        font: inherit;
        font-weight: 700;
        padding: 10px 12px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.primary { background: #6d5efc; color: #fff; }
      button.primary:disabled { opacity: 0.55; cursor: default; }
      button.secondary { background: #eef0f4; color: #1f2328; font-weight: 600; }
      #msg { font-size: 12.5px; margin-top: 6px; min-height: 16px; }
      #msg.ok { color: #116329; }
      #msg.err { color: #cf222e; }
      #msg.info { color: #0969da; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">◆</span>
      <h1>Cortex Memory</h1>
    </header>
    <div class="body">
      <div class="status-line"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></div>
      <div class="meta" id="siteMeta"></div>
      <button id="pull" class="primary" type="button" disabled>Pull context into this page</button>
      <button id="openOptions" class="secondary" type="button">Settings</button>
      <div id="msg"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
