<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Memory</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 340px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f4ed;
        color: #2b2620;
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 16px 18px 13px;
        background: #f7f4ed;
        border-bottom: 1px solid rgba(43, 38, 32, 0.12);
      }
      header .mark { color: #8c3a2b; font-size: 17px; }
      header h1 { margin: 0; font: 600 18px/1.1 Georgia, "Times New Roman", serif; }
      .body { padding: 16px 18px 18px; }
      .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: #c0c4cc; }
      .dot.ok { background: #4f6b45; }
      .dot.warn { background: #b58121; }
      .dot.err { background: #8c3a2b; }
      .meta { min-height: 34px; font-size: 12px; line-height: 1.4; color: #5c554b; margin: 2px 0 14px; overflow-wrap: anywhere; }
      button {
        width: 100%;
        font: inherit;
        min-height: 42px;
        font-weight: 650;
        padding: 10px 13px;
        border-radius: 8px;
        border: 1px solid rgba(43, 38, 32, 0.14);
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.primary { background: #8c3a2b; border-color: #8c3a2b; color: #fffdfa; }
      button.primary:disabled { opacity: 0.55; cursor: default; }
      button.secondary { background: #fefdfa; color: #2b2620; font-weight: 600; }
      button:hover:not(:disabled) { filter: brightness(0.97); }
      button:focus-visible { outline: 3px solid rgba(140, 58, 43, 0.25); outline-offset: 2px; }
      #msg { font-size: 12.5px; margin-top: 6px; min-height: 16px; }
      #msg.ok { color: #4f6b45; }
      #msg.err { color: #8c3a2b; }
      #msg.info { color: #5c554b; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">◆</span>
      <h1>Cortex Memory</h1>
    </header>
    <div class="body">
      <div class="status-line"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></div>
      <div class="meta" id="siteMeta"></div>
      <button id="pull" class="primary" type="button" disabled>Pull context into this page</button>
      <button id="openOptions" class="secondary" type="button">Settings</button>
      <div id="msg"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
