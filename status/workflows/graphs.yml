# Copy to .github/workflows/graphs.yml in the dedicated status repo.
# Regenerates the per-site response-time graph images.
name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *" # once a day
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    steps:
      - name: Await previous runs
        uses: ahmadnassri/action-workflow-queue@v1
      - name: Generate graphs
        uses: upptime/uptime-monitor@v1.35.0
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
